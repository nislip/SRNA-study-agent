# librechat.yaml — srna-study-agent
# Foundation stage: first MCP server (PubMed), then OAuth with Google Drive.
#
# Secrets (GOOGLE_MCP_CLIENT_ID, GOOGLE_MCP_CLIENT_SECRET) live in the
# Hugging Face Space's "Variables and secrets", never in this file.
#
# This file REPLACES the template's demo config (demo terms, social logins,
# the 302AI endpoint, S3 storage). Gemini works without any endpoint entry
# here, because GOOGLE_KEY=user_provided turns on the built-in Google endpoint.

# Latest config version reported by LibreChat v0.8.8's startup log.
version: 1.3.17
cache: true

# Store uploaded files inside the Space. They're wiped when the Space
# restarts, which is fine while testing. (The template used S3, which
# isn't set up and caused an error at startup.)
fileStrategy: local

# Keep the provider menu and the "Set API key" button visible.
# (Model specs hide them by default, and friends need them to enter their Gemini key.)
interface:
  modelSelect: true

# Agents defined in git. Each entry in "list" shows up in the top-left menu.
modelSpecs:
  prioritize: true
  list:
    # Proof of concept: proves instructions + an MCP server load from this file.
    - name: "rex-test"
      label: "Rex Test"
      description: "Proof-of-concept agent that finds three PubMed studies"
      default: true
      mcpServers:
        - pubmed
      preset:
        endpoint: "google"
        model: "gemini-3.1-flash-lite"   # change to a model ID from your GOOGLE_MODELS variable
        promptPrefix: |
          You are Rex, a friendly study helper for student nurse anesthetists.
          Begin every reply with "Rex here!" so we can confirm these instructions loaded.
          When asked about a topic, use the PubMed tools to find three relevant studies.
          For each one, give the title, year, PMID, and a one-sentence summary.
          Only list studies the PubMed tools actually returned. Never invent citations.

mcpServers:
  # First MCP server: PubMed (no login needed).
  # Public instance run by the open-source project's author (cyanheads/pubmed-mcp-server).
  # It's a free community server with no uptime guarantee; we can self-host it later.
  # Never put patient details in searches. Queries go to a third-party server.
  pubmed:
    title: "PubMed"
    description: "Search PubMed, PubMed Central, and Europe PMC for biomedical literature"
    type: streamable-http
    url: https://pubmed.caseyjhand.com/mcp

  # Google Drive OAuth test. Each user signs in with their own Google account.
  # Client ID and secret come from Hugging Face Space secrets.
  drive:
    title: "Google Drive Test"
    type: streamable-http
    url: https://drivemcp.googleapis.com/mcp/v1
    oauth:
      authorization_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      client_id: "${GOOGLE_MCP_CLIENT_ID}"
      client_secret: "${GOOGLE_MCP_CLIENT_SECRET}"
      redirect_uri: "https://nislip-srna-study-agent.hf.space/api/mcp/drive/oauth/callback"
      scope: "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file"