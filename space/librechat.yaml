# librechat.yaml — srna-study-agent
# Foundation stage: first MCP server (PubMed), then OAuth with Google Drive.
#
# Secrets (GOOGLE_MCP_CLIENT_ID, GOOGLE_MCP_CLIENT_SECRET) live in the
# Hugging Face Space's "Variables and secrets", never in this file.
#
# This file REPLACES the template's demo config (demo terms, social logins,
# the 302AI endpoint, S3 storage). Gemini works without any endpoint entry
# here, because GOOGLE_KEY=user_provided turns on the built-in Google endpoint.

# Latest config version reported by LibreChat v0.8.8's startup log.
version: 1.3.17
cache: true

# Store uploaded files inside the Space. They're wiped when the Space
# restarts, which is fine while testing. (The template used S3, which
# isn't set up and caused an error at startup.)
fileStrategy: local

# Keep the provider menu and the "Set API key" button visible.
# (Model specs hide them by default, and friends need them to enter their Gemini key.)
interface:
  modelSelect: true

# Agents defined in git. Each entry in "list" shows up in the top-left menu.
# Both SugammaRex versions share one set of instructions and tools (the &/* lines
# below are YAML "anchors": write it once, reuse it). Edit the instructions once
# and both versions update.
modelSpecs:
  prioritize: true
  list:
    - name: "sugammarex-gemini"
      label: "SugammaRex (Gemini)"
      description: "Study partner for SRNAs. Uses your free Gemini key."
      default: true
      mcpServers: &sugammarex_tools
        - pubmed
        - openfda
        - medcalc
      preset:
        endpoint: "google"
        model: "gemini-3.1-flash-lite"   # change to a model ID from your GOOGLE_MODELS variable
        promptPrefix: &sugammarex_instructions |
          You are SugammaRex, a study partner for student registered nurse anesthetists (SRNAs).
          Your job is to help them learn: explain concepts clearly, connect pharmacology and
          physiology to anesthesia practice, and quiz them when they ask.

          Tools and when to use them:
          - PubMed: for research questions. Cite each study with its title, year, and PMID.
            Only cite studies the PubMed tools actually returned. Never invent citations.
          - openFDA: for drug labels, boxed warnings, contraindications, interactions,
            recalls, and shortages. Say which openFDA data you used.
            FAERS adverse event reports are voluntary and do not prove a drug caused a
            reaction. Always say this when you report them, and never present report
            counts as rates.
          - Medical Calculators: for any clinical score or formula (ASA, RCRI, Mallampati,
            CKD-EPI, and so on). Always use the calculator instead of doing the math
            yourself, show the inputs you used, and include the calculator's citation.

          Rules:
          - This is a study tool, not clinical decision support. If someone appears to be
            making a real patient-care decision, remind them to follow their clinical
            preceptor, institutional protocols, and current references.
          - Never ask for or accept patient names, dates of birth, record numbers, or other
            identifying details. If a user shares them, tell them to remove them.
          - If you are unsure or the tools return nothing useful, say so plainly instead
            of guessing.
          - Keep answers focused and well organized. Use short sections or lists when they
            help the user study.

    - name: "sugammarex-claude"
      label: "SugammaRex (Claude)"
      description: "Same study partner on Claude. Requires your own Anthropic API key."
      mcpServers: *sugammarex_tools
      preset:
        endpoint: "anthropic"
        model: "claude-sonnet-5-5"   # must be listed in your ANTHROPIC_MODELS variable
        promptPrefix: *sugammarex_instructions

    - name: "sugammarex-openai"
      label: "SugammaRex (OpenAI)"
      description: "Same study partner on OpenAI. Requires your own OpenAI API key."
      mcpServers: *sugammarex_tools
      preset:
        endpoint: "openAI"
        model: "gpt-6-luna"   # must be listed in your OPENAI_MODELS variable
        promptPrefix: *sugammarex_instructions

mcpServers:
  # First MCP server: PubMed (no login needed).
  # Public instance run by the open-source project's author (cyanheads/pubmed-mcp-server).
  # It's a free community server with no uptime guarantee; we can self-host it later.
  # Never put patient details in searches. Queries go to a third-party server.
  pubmed:
    title: "PubMed"
    description: "Search PubMed, PubMed Central, and Europe PMC for biomedical literature"
    type: streamable-http
    url: https://pubmed.caseyjhand.com/mcp

  # openFDA: FDA drug labels, adverse events, recalls, shortages, Orange Book, NDC.
  # Runs inside the Space (stdio). Uses ONE shared openFDA key for everyone,
  # stored as the Space secret OPENFDA_API_KEY (never put the key in this file).
  openfda:
    title: "openFDA"
    description: "FDA drug labels, adverse event reports, recalls, shortages, and approvals"
    type: stdio
    command: npx
    args:
      - "-y"
      - "@ythalorossy/openfda@2"
    env:
      OPENFDA_API_KEY: "${OPENFDA_API_KEY}"
    timeout: 60000

  # Medical calculators: 150+ validated clinical scores (ASA, RCRI, Mallampati,
  # SOFA, CKD-EPI, and more), each citing its source paper. No API key needed.
  # Installed by the Dockerfile; runs inside the Space.
  medcalc:
    title: "Medical Calculators"
    description: "Validated clinical scores and formulas with literature citations"
    type: stdio
    command: sh
    args:
      - "-c"
      - "cd /app/mcp-servers/medical-calc && exec .venv/bin/python -m src.main"
    timeout: 60000

  # Google Drive OAuth test. Each user signs in with their own Google account.
  # Client ID and secret come from Hugging Face Space secrets.
  drive:
    title: "Google Drive Test"
    type: streamable-http
    url: https://drivemcp.googleapis.com/mcp/v1
    oauth:
      authorization_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      client_id: "${GOOGLE_MCP_CLIENT_ID}"
      client_secret: "${GOOGLE_MCP_CLIENT_SECRET}"
      redirect_uri: "https://nislip-srna-study-agent.hf.space/api/mcp/drive/oauth/callback"
      scope: "https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file"

skillSync:
  github:
    enabled: true
    runOnStartup: true
    intervalMinutes: 60
    sources:
      - id: sugammarex-skills
        owner: YOUR-GITHUB-USERNAME
        repo: srna-study-agent
        ref: main
        paths:
          - skills
        token: '${GITHUB_SKILLS_TOKEN}'